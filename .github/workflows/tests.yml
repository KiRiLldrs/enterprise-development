name: Tests

on:
  push:
    branches:
      - main
      - lab1
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HotelSystem.slnx

      - name: Build project
        run: dotnet build HotelSystem.slnx --no-restore

      - name: Run tests
        run: dotnet test HotelSystem.slnx --no-build --verbosity normal